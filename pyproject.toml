[project]
name = "max-lines-n-in-a-row-3d"
version = "0.1.0"
description = "A 3D n-in-a-row game where the goal is to connect as many lines as possible, with 5 algorithms competing against each other."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "tqdm>=4.68.4",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
